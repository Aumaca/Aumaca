<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Carlos Aumaca. Developer. Web and mobile.">
  <title>Carlos Aumaca. Developer. Web and mobile.</title>
  <defs>
    <filter id="blur" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#2997ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a8d4ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2997ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="440" rx="24"/></clipPath>
    <style>
      text { font-family: "Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      @media (prefers-reduced-motion: no-preference) {
        .light { animation: drift 18s ease-in-out infinite alternate; }
        .halo { animation: breathe 9s ease-in-out infinite; }
      }
      @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(200px); } }
      @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="#000"/>

    <ellipse class="halo" cx="640" cy="360" rx="520" ry="52" fill="#2997ff" opacity="0.8" filter="url(#blur)"/>
    <g class="light">
      <ellipse cx="640" cy="356" rx="230" ry="30" fill="#7cc0ff" opacity="0.75" filter="url(#blur)"/>
    </g>

    <circle cx="640" cy="1534" r="1180" fill="#000"/>
    <circle cx="640" cy="1534" r="1180" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

    <text x="640" y="196" text-anchor="middle" font-size="96" font-weight="700" letter-spacing="-3" fill="#f5f5f7">Carlos Aumaca</text>
    <text x="640" y="254" text-anchor="middle" font-size="34" font-weight="400" letter-spacing="-0.4" fill="#a1a1a6">Developer. Web and mobile.</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="23.5" fill="none" stroke="#2c2c2e"/>
</svg>
